<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chase Online Banking</title>

<style>
/* CSS RESET & VARS */
*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --chase-blue: #117aca;
    --chase-dark: #0a4e82;
    --chase-navy: #002d62;
    --bg-gray: #f4f6f8;
    --card-bg: #ffffff;
    --text-primary: #1e293b;
    --text-secondary: #64748b;
    --border-color: #e2e8f0;
    --danger-red: #dc2626;
    --success-green: #15803d;
    --pending-yellow: #b45309;
}

html, body {
    width: 100%;
    min-height: 100vh;
    overflow-x: hidden;
    background: #001e43;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-primary);
}

/* APP SHELL */
.app-container {
    max-width: 480px;
    margin: 0 auto;
    background: #ffffff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: 0 0 25px rgba(0,0,0,0.3);
}

/* HEADER */
.header {
    background: var(--chase-navy);
    color: #ffffff;
    padding: 12px 16px 16px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

.header-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.user-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #38bdf8;
}

.user-info h2 {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.2;
    color: #ffffff;
}

.user-info p {
    font-size: 11px;
    color: #93c5fd;
}

.fdic-badge {
    font-size: 9px;
    border: 1px solid rgba(255,255,255,0.4);
    padding: 2px 4px;
    border-radius: 3px;
    color: #93c5fd;
    font-weight: 700;
}

/* VIEWS */
.view {
    display: none;
    flex: 1;
    padding-bottom: 75px;
    background: var(--bg-gray);
}

.view.active {
    display: block;
}

/* CARD UI */
.card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 20px;
    margin: 16px;
    border: 1px solid var(--border-color);
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

.balance-card {
    background: linear-gradient(135deg, #002d62 0%, #117aca 100%);
    color: white;
    padding: 20px;
    margin: 16px;
    border-radius: 14px;
    box-shadow: 0 4px 12px rgba(17, 122, 202, 0.25);
    border: none;
}

.account-type {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #93c5fd;
    font-weight: 600;
    margin-bottom: 4px;
}

.account-number {
    font-size: 13px;
    color: #cbd5e1;
    font-family: monospace;
    margin-bottom: 16px;
}

.balance-label {
    font-size: 11px;
    color: #93c5fd;
    text-transform: uppercase;
}

.balance-amount {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin: 4px 0 20px 0;
}

/* ACTION BUTTONS */
.action-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.btn-action {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
}

.btn-send {
    background: #ffffff;
    color: var(--chase-navy);
}

.btn-receive {
    background: rgba(255, 255, 255, 0.18);
    color: white;
}

/* SECTION HEADERS */
.section-title {
    font-size: 15px;
    font-weight: 700;
    padding: 16px 16px 8px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--text-primary);
}

.see-all-link {
    font-size: 13px;
    color: var(--chase-blue);
    text-decoration: none;
    font-weight: 600;
    cursor: pointer;
}

/* SEARCH BAR */
.search-container {
    padding: 12px 16px;
    background: #ffffff;
    border-bottom: 1px solid var(--border-color);
}

.search-input {
    width: 100%;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    font-size: 14px;
    outline: none;
    background: var(--bg-gray);
}

.search-input:focus {
    background: #ffffff;
    border-color: var(--chase-blue);
}

/* TRANSACTION LIST */
.tx-list {
    background: white;
    border-top: 1px solid var(--border-color);
    border-bottom: 1px solid var(--border-color);
}

.tx-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border-color);
    cursor: pointer;
}

.tx-item:last-child {
    border-bottom: none;
}

.tx-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #f1f5f9;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 12px;
    flex-shrink: 0;
    color: var(--chase-dark);
}

.tx-details {
    flex: 1;
}

.tx-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 2px;
}

.tx-date {
    font-size: 11px;
    color: var(--text-secondary);
}

.tx-amount {
    font-size: 15px;
    font-weight: 700;
    text-align: right;
}

.tx-amount.negative {
    color: var(--text-primary);
}

.tx-amount.positive {
    color: var(--success-green);
}

/* MODALS */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    justify-content: center;
    align-items: flex-end;
}

.modal.active {
    display: flex;
}

.modal-content {
    background: white;
    width: 100%;
    max-width: 480px;
    border-radius: 20px 20px 0 0;
    padding: 24px;
    animation: slideUp 0.25s ease-out;
}

@keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.modal-title {
    font-size: 18px;
    font-weight: 700;
}

.close-btn {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: var(--text-secondary);
}

.form-group {
    margin-bottom: 16px;
}

.form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--text-secondary);
}

.form-group input {
    width: 100%;
    padding: 12px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    font-size: 15px;
    outline: none;
}

.form-group input:focus {
    border-color: var(--chase-blue);
}

.btn-submit {
    width: 100%;
    padding: 14px;
    background: var(--chase-blue);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
}

.detail-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--border-color);
    font-size: 14px;
}

.detail-label {
    color: var(--text-secondary);
}

.detail-value {
    font-weight: 600;
    color: var(--text-primary);
}

/* BOTTOM NAV */
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    height: 65px;
    background: #ffffff;
    border-top: 1px solid var(--border-color);
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 100;
}

.nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    background: none;
    border: none;
    width: 25%;
}

.nav-item.active {
    color: var(--chase-blue);
    font-weight: 700;
}

.nav-item svg {
    width: 22px;
    height: 22px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
}

.tx-count-banner {
    padding: 10px 16px;
    font-size: 12px;
    color: var(--text-secondary);
    background: var(--bg-gray);
    border-bottom: 1px solid var(--border-color);
}
</style>
</head>

            if (day === 20) continue;
            
            if (Math.random() > 0.35 && currentTxCount < 399) {
                const isFood = Math.random() > 0.4;
                let txName, txAmount, txType;

                if (isFood) {
                    txName = foodVendors[foodIndex % foodVendors.length];
                    foodIndex++;
                    txAmount = getRandomSmallAmount();
                    txType = "food";
                } else {
                    const recipient = transferRecipients[recipientIndex % transferRecipients.length];
                    recipientIndex++;
                    txName = `Transfer to ${recipient}`;
                    txAmount = getRandomHighAmount();
                    txType = "transfer";
                }

                const hour = Math.floor(Math.random() * 12) + 1;
                const min = Math.floor(Math.random() * 50) + 10;
                const ampm = Math.random() > 0.5 ? 'AM' : 'PM';

                txs.push({
                    name: txName,
                    date: `${m.name} ${day < 10 ? '0' + day : day}, ${m.year} • ${hour < 10 ? '0' + hour : hour}:${min} ${ampm}`,
                    amount: parseFloat(txAmount),
                    type: txType
                });
                currentTxCount++;
            }
        }
    });

    return txs;
}

const allTransactions = generateTransactions();

// RENDER TRANSACTIONS
function renderTransactions(listToRender = allTransactions) {
    const recentContainer = document.getElementById('recentTxList');
    const fullContainer = document.getElementById('fullTxList');

    recentContainer.innerHTML = '';
    fullContainer.innerHTML = '';

    listToRender.forEach((tx, index) => {
        const isNegative = tx.amount < 0;
        const formattedAmount = (isNegative ? '-$' : '+$') + Math.abs(tx.amount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        
        let iconSvg = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>`;
        if (tx.type === "mortgage") {
            iconSvg = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>`;
        } else if (tx.type === "transfer") {
            iconSvg = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>`;
        } else if (tx.type === "food") {
            iconSvg = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path></svg>`;
        }

        const html = `
            <div class="tx-item" onclick="showTxDetail(${index})">
                <div class="tx-icon">${iconSvg}</div>
                <div class="tx-details">
                    <div class="tx-name">${tx.name}</div>
                    <div class="tx-date">${tx.date}</div>
                </div>
                <div class="tx-amount ${isNegative ? 'negative' : 'positive'}">${formattedAmount}</div>
            </div>
        `;

        if (index < 10) {
            recentContainer.innerHTML += html;
        }

        fullContainer.innerHTML += html;
    });
}

function filterTransactions() {
    const query = document.getElementById('txSearchInput').value.toLowerCase();
    const filtered = allTransactions.filter(tx => 
        tx.name.toLowerCase().includes(query) || 
        tx.amount.toString().includes(query) ||
        tx.date.toLowerCase().includes(query)
    );
    renderTransactions(filtered);
}

function showTxDetail(index) {
    const tx = allTransactions[index];
    const modalContent = document.getElementById('modalDetailContent');
    
    modalContent.innerHTML = `
        <div class="detail-row"><span class="detail-label">Merchant / Recipient</span><span class="detail-value">${tx.name}</span></div>
        <div class="detail-row"><span class="detail-label">Amount</span><span class="detail-value">$${Math.abs(tx.amount).toLocaleString('en-US', {minimumFractionDigits: 2})}</span></div>
        <div class="detail-row"><span class="detail-label">Date & Time</span><span class="detail-value">${tx.date}</span></div>
        <div class="detail-row"><span class="detail-label">Status</span><span class="detail-value">Posted</span></div>
        <div class="detail-row"><span class="detail-label">Account</span><span class="detail-value">Premier Checking (••4821)</span></div>
        <div class="detail-row"><span class="detail-label">Transaction ID</span><span class="detail-value">CHK-${Math.floor(10000000 + Math.random() * 90000000)}</span></div>
    `;
    
    document.getElementById('detailModal').classList.add('active');
}

function switchView(viewId) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

    document.getElementById(viewId).classList.add('active');

    if (viewId === 'homeView') {
        document.getElementById('navHome').classList.add('active');
    } else if (viewId === 'historyView') {
        document.getElementById('navHistory').classList.add('active');
    }

    window.scrollTo(0, 0);
}

function openModal(modalId) {
    document.getElementById(modalId).classList.add('active');
}

function closeModal(modalId) {
    document.getElementById(modalId).classList.remove('active');
}

document.getElementById('sendForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const recipient = this.querySelector('input[type="text"]').value;
    const amount = parseFloat(this.querySelector('input[type="number"]').value);

    if (amount > currentBalance) {
        alert('Insufficient funds available.');
        return;
    }

    currentBalance -= amount;
    updateBalanceDisplay();

    const now = new Date();
    const timeStr = now.toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' }) + ' • Just now';
    
    allTransactions.unshift({
        name: `Transfer to ${recipient}`,
        date: timeStr,
        amount: -amount,
        type: "transfer"
    });

    renderTransactions();
    closeModal('sendModal');
    this.reset();
    alert(`Successfully transferred $${amount.toFixed(2)} to ${recipient}`);
});

document.getElementById('receiveForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const sender = this.querySelector('input[type="text"]').value;
    const amount = parseFloat(this.querySelector('input[type="number"]').value);

    closeModal('receiveModal');
    this.reset();
    alert(`Payment request of $${amount.toFixed(2)} sent to ${sender}`);
});

function updateBalanceDisplay() {
    document.getElementById('mainBalanceDisplay').textContent = '$' + currentBalance.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

renderTransactions();
</script>
